services:
  postgres:
    image: postgres:15-alpine
    container_name: alzohra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: alzohra_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d alzohra_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alzohra-network

  server:
    build: ./server
    container_name: alzohra-server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/alzohra_db
      PORT: 5000
      NODE_ENV: development
      JWT_SECRET: your-secret-key-change-this
      CLIENT_URL: http://localhost:3001
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: alzohra_db
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - alzohra-network

  client:
    build: ./client
    container_name: alzohra-client
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "3001:3002"
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./client:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - alzohra-network

volumes:
  pgdata:
    driver: local

networks:
  alzohra-network:
    driver: bridge
